[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.1.0"
description = "Fitness-driven lifecycle management for reusable agent skills"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.30"]
dev = ["pytest>=8"]
training = [
  "accelerate",
  "datasets",
  "dill",
  "gym>=0.26,<1",
  "gymnasium>=0.29,<1",
  "hydra-core",
  "numpy",
  "pandas",
  "pyarrow>=19.0.0",
  "Pillow",
  "PyYAML",
  "ray[default]>=2.41.0,<2.51.0",
  "tensordict>=0.8,<=0.10,!=0.9.0",
  "torch>=2.0",
  "torchvision",
  "transformers<=4.57.3",
]
gpu = [
  "vllm>=0.8.5,<=0.11.0",
]

[tool.setuptools.packages.find]
include = ["skillforge*", "skill_generation*", "agent_system*", "verl*"]

[tool.setuptools.package-data]
verl = ["version/*", "trainer/config/*.yaml"]
